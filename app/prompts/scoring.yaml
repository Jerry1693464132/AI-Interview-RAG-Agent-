# 评分 Prompt 模板 — 评分模版示例
# 在后续阶段中会完善真实的 Prompt 内容

prompts:
  - name: "scoring"
    version: "v1"
    description: "AI 面试评分 — 注入 reference_answer 与 key_points"
    variables:
      - question
      - answer
      - reference_answer
      - key_points
    template: |
      你是一位资深技术面试官。请根据以下信息对候选人的回答进行评分。

      【面试题目】
      {question}

      【参考答案】
      {reference_answer}

      【关键得分点】
      {key_points}

      【候选人回答】
      {answer}

      请从以下维度评分（每项1-10分）并给出详细反馈：
      1. 技术准确性：回答是否与技术事实一致
      2. 完整性：是否覆盖关键得分点
      3. 表达清晰度：逻辑是否清晰、条理是否分明
      4. 深度：是否展现出深入理解而非表面知识

      请以 JSON 格式输出评分结果。
